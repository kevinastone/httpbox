<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Box Left Face -->
  <polygon points="10,30 50,50 50,90 10,70" fill="#E87C27" />
  
  <!-- Box Right Face -->
  <polygon points="50,50 90,30 90,70 50,90" fill="#C56216" />
  
  <!-- Box Top Face -->
  <polygon points="50,10 90,30 50,50 10,30" fill="#FF9A3D" />

  <!-- Tape NW to SE (on top face) -->
  <polygon points="26,22 34,18 74,38 66,42" fill="#FDE0B3" />
  
  <!-- Tape NE to SW (on top face) -->
  <polygon points="66,18 74,22 34,42 26,38" fill="#FDE0B3" opacity="0.85" />

  <!-- Tape down Right face -->
  <polygon points="66,42 74,38 74,56 66,60" fill="#DFB374" />
  
  <!-- Tape down Left face -->
  <polygon points="26,38 34,42 34,60 26,56" fill="#E8C38B" />
</svg>
