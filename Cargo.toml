[workspace]
members = [
  ".",
  "hyper_body",
  "uri_path",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/kevinastone/httpbox"

[workspace.dependencies]
futures = "^0.3.1"
http-body-util = "^0.1.0"
hyper = "^1.0"
itertools = "^0.14.0"
serde = { version = "^1.0.98", features = ["derive"] }

# Internal workspace crates
hyper_body = { path = "hyper_body" }
uri_path = { path = "uri_path" }

[package]
name = "httpbox"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "httpbox"
path = "src/main.rs"

[dependencies]
anyhow = "^1.0.27"
askama = "^0.14"
async-trait = "^0.1"
clap = { version = "^4.0.29", features = ["derive", "env"] }
clap_complete = "^4.0"
cookie = "^0.18.1"
futures = { workspace = true }
headers = "^0.4"
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper_body = { workspace = true }
hyper-util = { version = "^0.1.20", features = [
  "server",
  "server-auto",
  "tokio",
] }
itertools = { workspace = true }
mime = "^0.3.13"
rand = { version = "^0.9" }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { workspace = true }
serde_urlencoded = "^0.7"
tokio = { version = "^1.50.0", features = ["full"] }
tokio-stream = { version = "^0.1.18", features = ["net"] }
tower = { version = "^0.5.2", features = ["full"] }
tower-http = { version = "^0.6.8", features = ["timeout", "trace"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
uri_path = { workspace = true }
url = "^2.2.1"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
